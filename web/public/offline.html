<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Cerberus Live Studio</title>
  <style>
    html,body{height:100%;margin:0;background:#050505;color:#f2f2f2;font-family:system-ui,sans-serif}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:2rem}
    h1{font-size:1.25rem;margin:0}
    p{color:#8f8f8f;max-width:28rem;line-height:1.6;margin:0}
    .mark{color:#d71920;font-weight:700;letter-spacing:.1em}
    button{margin-top:.5rem;background:#d71920;color:#fff;border:0;border-radius:.5rem;padding:.65rem 1.5rem;font-size:.9rem;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">CERBERUS LIVE</div>
    <h1>You're offline</h1>
    <p>The gate is closed for now. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
